name: LTMTodo
options:
  bundleIdPrefix: app.ltm.todo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  LTMTodo:
    type: application
    platform: iOS
    sources:
      - path: LTMTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.ltm.todo
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LTM Todo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
