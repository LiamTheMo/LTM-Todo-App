name: Deploy Web to Cloudflare Worker

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: ltm-todo-app-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Verify main merge and version source
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          [[ "$BASE" == "main" && "$HEAD" =~ ^v[0-9]+\.[0-9]{2}$ ]] || {
            echo "Production deployment requires a merged vX.XX -> main pull request."
            exit 1
          }
          [[ "$(git rev-parse HEAD)" == "$MERGE_SHA" ]] || {
            echo "Checkout does not match the main merge commit."
            exit 1
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build Cloudflare Worker
        run: npm run build:vinext
      - name: Deploy ltm-todo-app
        shell: bash
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if [[ "$(git rev-parse origin/main)" != "$MERGE_SHA" ]]; then
            echo "A newer main merge superseded this deployment."
            exit 0
          fi
          npx wrangler deploy --config dist/server/wrangler.json
