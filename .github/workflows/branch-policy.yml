name: Branch Policy

on:
  pull_request:
    branches:
      - main
      - 'v[0-9]+.[0-9][0-9]'

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch flow
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE" == "main" ]]; then
            [[ "$HEAD" =~ ^v[0-9]+\.[0-9]{2}$ ]] || {
              echo "main only accepts version branches (vX.XX)."
              exit 1
            }
          elif [[ "$BASE" =~ ^v[0-9]+\.[0-9]{2}$ ]]; then
            [[ "$HEAD" != "main" && ! "$HEAD" =~ ^v[0-9]+\.[0-9]{2}$ ]] || {
              echo "Version branches accept temporary development branches."
              exit 1
            }
          fi
