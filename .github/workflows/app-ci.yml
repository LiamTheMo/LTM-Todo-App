name: Major Branch CI

on:
  push:
    branches:
      - 'v[0-9]+.[0-9][0-9]'

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: node scripts/audit-dependencies.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:vinext

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            docs/PRODUCT_SPEC.md
            docs/ARCHITECTURE.md
            docs/DATA_MODEL.md
            docs/DASHBOARD_UX.md
            docs/ROADMAP.md
            docs/WORKFLOWS.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Reject merge-conflict markers
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=build '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Merge conflict markers found."
            exit 1
          fi
