name: Major Branch CI

on:
  push:
    branches:
      - 'v[0-9]+.[0-9][0-9]'

permissions:
  contents: read

jobs:
  swift-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Test platform-neutral Swift core
        run: swift test

  # Keep the established required-check name for the main ruleset while making
  # the no-native-build policy explicit. An unsigned simulator app cannot be
  # installed on a physical iPhone/iPad from a GitHub artifact.
  apple:
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm native iOS builds are disabled
        run: echo "Native iOS app builds and simulator UI tests are disabled; use the deployed web app on iPhone/iPad."

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:vinext

  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Check required foundation files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            docs/PRODUCT_SPEC.md
            docs/ARCHITECTURE.md
            docs/DATA_MODEL.md
            docs/DASHBOARD_UX.md
            docs/ROADMAP.md
            docs/WORKFLOWS.md
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty: $file"; exit 1; }
          done
      - name: Reject merge-conflict markers
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=build '^(<<<<<<<|=======|>>>>>>>)' .; then
            echo "Merge conflict markers found."
            exit 1
          fi
